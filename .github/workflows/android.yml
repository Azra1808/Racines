name: Tests et APK Android

# Deux raisons d'exister :
#   1. La branche principale doit toujours compiler — règle d'ingénierie du
#      README, jusqu'ici non vérifiée par une machine.
#   2. Produire un APK installable sans compte Expo ni carte bancaire.
#      L'APK est déposé en artefact du workflow, téléchargeable depuis
#      l'onglet Actions du dépôt.

on:
  push:
    branches: [main, 'krys/**']
  pull_request:
    branches: [main]
  workflow_dispatch: # permet de lancer une compilation à la demande

jobs:
  tests:
    name: Tests automatiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les dépendances
        working-directory: mobile
        run: npm ci

      - name: Lancer les tests
        working-directory: mobile
        run: npm test

  apk:
    name: Compiler l'APK
    runs-on: ubuntu-latest
    needs: tests # on ne compile jamais une version dont les tests échouent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Le SDK Android est déjà installé sur les machines GitHub ; il ne reste
      # qu'à fournir le bon JDK. C'est ce qui permet de se passer d'EAS.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        working-directory: mobile
        run: npm ci

      - name: Générer le projet Android natif
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Compiler l'APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      # Le nom porte le numéro de compilation et le début du commit : deux
      # APK différents ne peuvent pas être confondus au moment de filmer.
      - name: Renommer l'APK
        run: |
          mkdir -p artefact
          cp mobile/android/app/build/outputs/apk/release/*.apk \
             "artefact/RACINES-${{ github.run_number }}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RACINES-apk
          path: artefact/*.apk
          retention-days: 30
